<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagesse Numérique | Carte d'affaires</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="card-sheet">
  <section class="print-page business-card card-front" aria-label="Carte d'affaires recto">
    <div class="card-monogram-panel" aria-hidden="true">
      <img class="card-monogram" src="../images/sagesse-numerique-sn-steel-blue-mark-transparent.png" alt="">
      <span class="corner-arc"></span>
    </div>
    <span class="front-divider" aria-hidden="true"></span>
    <div class="card-safe">
      <div class="front-identity">
        <img class="brand-wordmark" src="../images/sagesse-numerique-typography.png" alt="Sagesse Numérique">
        <p class="card-kicker">Logiciels sur mesure</p>
        <span class="short-rule" aria-hidden="true"></span>
      </div>
      <div class="front-person">
        <h1 class="card-name">Philippe Tremblay</h1>
        <p class="card-title">Ingénieur produit</p>
      </div>
      <p class="card-contact" aria-label="Coordonnées">
        <span>phil@sagessenumerique.ca</span>
        <span>sagessenumerique.ca</span>
      </p>
    </div>
  </section>

  <section class="print-page business-card card-back" aria-label="Carte d'affaires verso">
    <div class="card-safe back-layout">
      <div class="back-copy">
        <span class="short-rule" aria-hidden="true"></span>
        <h2>Des logiciels sur mesure pour rendre vos opérations plus fiables.</h2>
        <span class="short-rule" aria-hidden="true"></span>
      </div>

      <div class="back-services" aria-label="Services">
        <article>
          <span class="service-symbol" aria-hidden="true">+</span>
          <strong>Produits numériques</strong>
        </article>
        <article>
          <span class="service-symbol" aria-hidden="true">&lt;/&gt;</span>
          <strong>Architecture évolutive</strong>
        </article>
        <article>
          <span class="service-symbol" aria-hidden="true">||</span>
          <strong>Performance et fiabilité</strong>
        </article>
      </div>

      <div class="qr-block card-qr">
        <img class="qr-code" src="assets/qr-contact.svg" alt="Code QR vers le formulaire de contact">
        <p class="qr-label">Scanner pour en savoir plus</p>
      </div>
    </div>
    <div class="card-back-band" aria-hidden="true">
      <img src="../images/sagesse-numerique-sn-steel-blue-mark-transparent.png" alt="">
    </div>
  </section>
</body>
</html>
